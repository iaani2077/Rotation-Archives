<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

 
<!-- Main stylesheet -->
<link rel="stylesheet" href="./wuwa.css">

<title>Wuwa Rotations</title>
 

</head>

<body>

 
<!-- =========================
     NAVBAR
========================= -->

<header>

    <div class="navbar">

        <!-- LEFT: Home -->
        <div class="navbar-left">
            <a href="./index.html" class="home-button">
                Home
            </a>
        </div>

        <!-- CENTER: Site Title -->
        <a href="./wuwa.html" class="nav-title">
            Wuwa Rotations
        </a>

        <!-- RIGHT: Navigation -->
        <nav>

            <div class="nav-item" id="notesItem">

                <button class="nav-button" id="notesButton">
                    Notes
                    <span class="arrow">▼</span>
                </button>

                <!-- Notes dropdown -->
                <div class="dropdown" id="notesPanel">

                    <div class="dropdown-title">
                        Notes
                    </div>

                    <p>
                        → Got a character, team, or rotation you want added?
                    </p>

                    <p>
                        → Found a wrong rotation, missing info, or something outdated?
                    </p>

                    <p class="personal-note">
                        I’m still working on this, so it might not be perfect.
                        Any feedback or suggestions are appreciated! &lt;3
                    </p>

                </div>

            </div>

        </nav>

    </div>

</header>


<!-- =========================
     MAIN CONTENT
========================= -->

<main>

    <h1>Select a Character</h1>


    <!-- =========================
         ATTRIBUTE FILTERS
    ========================= -->

    <div class="attribute-filters">

        <!-- Show all characters -->
        <button class="attribute-filter active" data-attribute="all">
            All
        </button>

        <!-- Havoc -->
        <button class="attribute-filter" data-attribute="Havoc">
            <img src="./images/attributes/havoc.png" alt="Havoc">
            <span>Havoc</span>
        </button>

        <!-- Electro -->
        <button class="attribute-filter" data-attribute="Electro">
            <img src="./images/attributes/electro.png" alt="Electro">
            <span>Electro</span>
        </button>

        <!-- Aero -->
        <button class="attribute-filter" data-attribute="Aero">
            <img src="./images/attributes/aero.png" alt="Aero">
            <span>Aero</span>
        </button>

        <!-- Glacio -->
        <button class="attribute-filter" data-attribute="Glacio">
            <img src="./images/attributes/glacio.png" alt="Glacio">
            <span>Glacio</span>
        </button>

        <!-- Fusion -->
        <button class="attribute-filter" data-attribute="Fusion">
            <img src="./images/attributes/fusion.png" alt="Fusion">
            <span>Fusion</span>
        </button>

        <!-- Spectro -->
        <button class="attribute-filter" data-attribute="Spectro">
            <img src="./images/attributes/spectro.png" alt="Spectro">
            <span>Spectro</span>
        </button>

        <!-- Character release sorting -->
        <button id="releaseSort">
            Oldest → Newest
        </button>

    </div>


    <!-- Character cards are generated by JavaScript -->
    <div class="characters"></div>


    <!-- =========================
         CHARACTER CONTENT
    ========================= -->

    <section id="character-content">


        <!-- Selected character information -->
        <h2 id="character-name"></h2>

        <p id="character-description"></p>


        <!-- Teams and rotations are generated by JavaScript -->
        <div id="teams-container"></div>

    </section>

</main>


<!-- =========================
     CHARACTER DATA
     Add new characters to the
     appropriate attribute file.
========================= -->

<script src="./js/updates/character/havoc.js"></script>
<script src="./js/updates/character/electro.js"></script>
<script src="./js/updates/character/aero.js"></script>
<script src="./js/updates/character/glacio.js"></script>
<script src="./js/updates/character/fusion.js"></script>
<script src="./js/updates/character/spectro.js"></script>


<!-- =========================
     TEAMS & ROTATIONS
     Add new team files here.
========================= -->

<script src="./js/updates/teams/camellya.js"></script>
<script src="./js/updates/teams/yyxl.js"></script>
<script src="./js/updates/teams/hiyuki.js"></script>
<script src="./js/updates/teams/augusta.js"></script>


<!-- Main JavaScript -->
<script src="./js/wuwa.js"></script>
 

</body>

</html>
